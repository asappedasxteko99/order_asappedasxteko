
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asap Pedas X Teko</title>

<meta name="theme-color" content="#b91c1c">
<meta name="description" content="Order Asap Pedas X Teko">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff;
}

/* Banner Install */
#installBanner {
  display: none;
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 30px);
  max-width: 420px;
  padding: 20px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,.25);
  z-index: 999999;
}

.banner-header {
  display: flex;
  align-items: center;
  gap: 12px;
}

.banner-icon {
  width: 60px;
  height: 60px;
  border-radius: 15px;
  background: #b91c1c;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  flex-shrink: 0;
}

.banner-title {
  font-size: 17px;
  font-weight: bold;
  color: #222;
}

.banner-desc {
  font-size: 13px;
  color: #666;
  margin-top: 5px;
}

.btn-install {
  width: 100%;
  margin-top: 18px;
  padding: 15px;
  background: #b91c1c;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.btn-install:active {
  transform: scale(.98);
}

.btn-later {
  width: 100%;
  margin-top: 8px;
  padding: 12px;
  background: #f3f3f3;
  color: #555;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  cursor: pointer;
}

#manualInstall {
  display: none;
  margin-top: 15px;
  padding: 13px;
  background: #fff7ed;
  border-radius: 12px;
  color: #7c2d12;
  font-size: 13px;
  line-height: 1.7;
}

</style>
</head>

<body>

<!-- Banner Install -->
<div id="installBanner">

  <div class="banner-header">

    <div class="banner-icon">🍗</div>

    <div>
      <div class="banner-title">
        Asap Pedas X Teko
      </div>

      <div class="banner-desc">
        Install aplikasi untuk akses order lebih cepat!
      </div>
    </div>

  </div>

  <button class="btn-install" id="installBtn">
    INSTALL SEKARANG
  </button>

  <button class="btn-later" id="laterBtn">
    NANTI
  </button>

  <div id="manualInstall">
    <b>Instalasi manual:</b><br>
    Klik menu browser <b>⋮</b>, lalu pilih
    <b>Tambahkan ke Layar Utama</b> atau
    <b>Install Aplikasi</b>.
  </div>

</div>

<script>

// ======================================
// URL HOME PAGE / WEBSITE ORDER
// ======================================

const TARGET_URL =
"https://script.google.com/macros/s/AKfycbwvndVST2ihd0uiG8x-pLIh-PRhn2G_YvGmuO2tcOLKaxUtlyNgcGKHJdIFPvf5G_7hNw/exec";

const banner = document.getElementById("installBanner");
const installBtn = document.getElementById("installBtn");
const laterBtn = document.getElementById("laterBtn");
const manualInstall = document.getElementById("manualInstall");

let deferredPrompt = null;
let installAttempted = false;

// ======================================
// CEK STATUS INSTALL
// ======================================

const isInstalled =
  window.matchMedia("(display-mode: standalone)").matches ||
  window.navigator.standalone === true;

// ======================================
// BUKA HOME PAGE OTOMATIS
// ======================================

function openHomePage() {
  window.location.replace(TARGET_URL);
}

// Jika sudah install, langsung buka home page
if (isInstalled) {

  openHomePage();

} else {

  // Tampilkan banner install
  banner.style.display = "block";

}

// ======================================
// SERVICE WORKER
// ======================================

if ("serviceWorker" in navigator) {

  window.addEventListener("load", function() {

    navigator.serviceWorker.register("./sw.js")
      .then(function(registration) {
        console.log("PWA aktif:", registration.scope);
      })
      .catch(function(error) {
        console.log("Service Worker error:", error);
      });

  });

}

// ======================================
// DETEKSI PROMPT INSTALL
// ======================================

window.addEventListener("beforeinstallprompt", function(event) {

  // Mencegah prompt muncul otomatis
  event.preventDefault();

  // Simpan prompt
  deferredPrompt = event;

});

// ======================================
// TOMBOL INSTALL SEKARANG
// ======================================

installBtn.addEventListener("click", async function() {

  installAttempted = true;

  // Jika browser mendukung prompt instalasi
  if (deferredPrompt) {

    // Jalankan prompt install langsung
    deferredPrompt.prompt();

    const result = await deferredPrompt.userChoice;

    if (result.outcome === "accepted") {

      banner.style.display = "none";

    } else {

      // Jika pengguna membatalkan install
      openHomePage();

    }

    deferredPrompt = null;

  } else {

    // Browser tidak menyediakan prompt otomatis
    manualInstall.style.display = "block";

    installBtn.textContent = "IKUTI PETUNJUK INSTALL";

  }

});

// ======================================
// TOMBOL NANTI
// ======================================

laterBtn.addEventListener("click", function() {

  // Langsung buka Home Page
  openHomePage();

});

// ======================================
// BERHASIL DIINSTALL
// ======================================

window.addEventListener("appinstalled", function() {

  banner.style.display = "none";

  // Buka halaman order setelah install
  openHomePage();

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Order Asap Pedas x Teko</title>
   <link rel="icon" type="image/x-icon" href="https://asappedasxteko99.github.io/order_asappedasxteko/Logo%20Asap%20Pedas%20Warna.svg">
  
  <!-- Meta PWA -->
  <meta name="theme-color" content="#008E98">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://asappedasxteko99.github.io/order_asappedasxteko/Logo%20Teko%20Warna.svg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f5f5f5;
    }

    /* Iframe untuk memuat Google Apps Script secara Fullscreen */
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Desain Banner Install PWA */
    #pwa-install-banner {
      display: none; /* Disembunyikan sampai browser siap menginstall */
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
      padding: 14px 16px;
      z-index: 9999;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid #eeeeee;
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from { bottom: -100px; opacity: 0; }
      to { bottom: 20px; opacity: 1; }
    }

    .pwa-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pwa-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      background: #ffebee;
    }

    .pwa-text h4 {
      font-size: 14px;
      color: #111111;
      margin-bottom: 2px;
    }

    .pwa-text p {
      font-size: 12px;
      color: #666666;
    }

    .pwa-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #btn-install {
      background-color: #d32f2f;
      color: #ffffff;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    #btn-install:active {
      background-color: #b71c1c;
    }

    #btn-close {
      background: transparent;
      border: none;
      color: #999999;
      font-size: 18px;
      padding: 4px 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Target URL Google Apps Script Anda -->
  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycbxSdZV7vGO_y09TUgXPnsZti3YRkrX0Xs2xL82RmAT7PxNN_no5eOwHiC6sgi2vNg-O0Q/exec"
    allow="geolocation; microphone; camera">
  </iframe>

  <!-- Banner Install Pintasan -->
  <div id="pwa-install-banner">
    <div class="pwa-info">
      <img src="https://asappedasxteko99.github.io/order_asappedasxteko/Logo%20Teko%20Warna.svg" class="pwa-icon">
      <div class="pwa-text">
       <!-- <h4>Order Asap Pedas</h4> -->
        <p>Install Aplikasi </p>
      </div>
    </div>
    <div class="pwa-actions">
      <button id="btn-install">Install</button>
      <button id="btn-close" title="Tutup">&times;</button>
    </div>
  </div>

  <script>
    // 1. Registrasi Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker terdaftar:', reg.scope))
          .catch(err => console.error('Gagal daftar Service Worker:', err));
      });
    }

    // 2. Logika Menangkap Event Install PWA
    let deferredPrompt;
    const installBanner = document.getElementById('pwa-install-banner');
    const btnInstall = document.getElementById('btn-install');
    const btnClose = document.getElementById('btn-close');

    window.addEventListener('beforeinstallprompt', (e) => {
      // Mencegah browser menampilkan mini-infobar bawaan yang kecil
      e.preventDefault();
      // Simpan event agar bisa dipicu saat tombol diklik
      deferredPrompt = e;
      // Tampilkan banner custom kita
      installBanner.style.display = 'flex';
    });

    // 3. Eksekusi Otomatis Saat Tombol "Install" Diklik
    btnInstall.addEventListener('click', async () => {
      if (!deferredPrompt) return;

      // Memunculkan dialog konfirmasi instalasi bawaan sistem
      deferredPrompt.prompt();

      // Menunggu pilihan user (Install / Batal)
      const { outcome } = await deferredPrompt.userChoice;
      console.log(`Respon user: ${outcome}`);

      // Reset prompt dan sembunyikan banner
      deferredPrompt = null;
      installBanner.style.display = 'none';
    });

    // Tombol tutup banner jika user belum ingin install
    btnClose.addEventListener('click', () => {
      installBanner.style.display = 'none';
    });

    // Sembunyikan banner otomatis jika aplikasi sudah berhasil terinstall
    window.addEventListener('appinstalled', () => {
      installBanner.style.display = 'none';
      deferredPrompt = null;
      console.log('PWA berhasil diinstall ke layar utama!');
    });
  </script>

</body>
</html>

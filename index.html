<!DOCTYPE html>
<html lang="id">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="https://monsterlongpotato.github.io/absensi/Logo%20Long%20Potato%20PNG%20500%20x%20500%20px.png">
    <meta name="theme-color" content="#fc8c02">
    <title>Aplikasi Absensi Long Potato</title>
    
    <!-- Manifest & Icon untuk Pintasan Chrome (PWA) -->
    <link rel="manifest" id="manifest-placeholder">
    <link rel="apple-touch-icon" href="https://monsterlongpotato.github.io/absensi/Logo%20Long%20Potato%20PNG%20500%20x%20500%20px.png">


  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    /* Iframe Fullscreen untuk Google Apps Script */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Banner / Tombol Install Mengambang di Halaman Depan */
    #installBanner {
      display: none; /* Muncul otomatis jika browser mendukung install */
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #ffffff;
      padding: 14px 20px;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      z-index: 9999;
      align-items: center;
      gap: 14px;
      animation: slideUp 0.4s ease-out;
    }
    @keyframes slideUp {
      from { bottom: -80px; opacity: 0; }
      to { bottom: 24px; opacity: 1; }
    }
    #installBanner span {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
    }
    #btnInstall {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #btnInstall:hover {
      background: #1d4ed8;
    }
    #btnClose {
      background: transparent;
      color: #94a3b8;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
    }
  </style>
</head>
<body>

  <!-- Memuat Google Apps Script Anda -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbwvndVST2ihd0uiG8x-pLIh-PRhn2G_YvGmuO2tcOLKaxUtlyNgcGKHJdIFPvf5G_7hNw/exec" 
    allow="geolocation; microphone; camera; fullscreen">
  </iframe>

  <!-- Pop-up Tombol Install PWA -->
  <div id="installBanner">
    <span>Pasang Aplikasi ini</span>
    <button id="btnInstall">Install</button>
    <button id="btnClose" title="Tutup">&times;</button>
  </div>

  <script>
    // 2. LOGIKA INSTALL PINTASAN KE LAYAR UTAMA (PWA)
        // Membuat file manifest.json secara dinamis di dalam satu file
        const manifestData = {
            "name": "Absensi Monster Long Potato",
            "short_name": "Absensi Long Potato",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#ffe0c4",
            "icons": [{
                "src": "https://monsterlongpotato.github.io/absensi/Logo%20Long%20Potato%20PNG%20500%20x%20500%20px.png",
                "sizes": "512x512",
                "type": "image/png"
            }]
        };
        const stringManifest = JSON.stringify(manifestData);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        document.querySelector('#manifest-placeholder').setAttribute('href', manifestURL);

        // Menangkap event install dari Google Chrome HP
        let deferredPrompt;
        const installBanner = document.getElementById('install-banner');
        const btnInstall = document.getElementById('btn-install');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Munculkan banner install di bagian bawah layar
            installBanner.style.display = 'flex';
        });

        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBanner.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });
  </script>

  
</body>
</html>

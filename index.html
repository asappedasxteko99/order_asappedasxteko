<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Web</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #ffffff;
    }
    /* Iframe Fullscreen untuk Google Apps Script */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Banner Install Otomatis */
    #installBanner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #ffffff;
      padding: 14px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 9999;
      width: 90%;
      max-width: 400px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: slideUp 0.4s ease-out;
    }
    @keyframes slideUp {
      from { bottom: -100px; opacity: 0; }
      to { bottom: 20px; opacity: 1; }
    }
    .banner-text {
      font-size: 14px;
      line-height: 1.4;
    }
    .banner-actions {
      display: flex;
      gap: 8px;
    }
    button {
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    #btnInstall {
      background: #0d6efd;
      color: white;
    }
    #btnClose {
      background: transparent;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Embed Google Apps Script -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbwvndVST2ihd0uiG8x-pLIh-PRhn2G_YvGmuO2tcOLKaxUtlyNgcGKHJdIFPvf5G_7hNw/exec" 
    allow="geolocation; microphone; camera; fullscreen">
  </iframe>

  <!-- Pop-up Banner PWA -->
  <div id="installBanner">
    <div class="banner-text">
      <strong>Install Aplikasi</strong><br>
      Akses lebih cepat langsung dari layar utama.
    </div>
    <div class="banner-actions">
      <button id="btnClose">Nanti</button>
      <button id="btnInstall">Install</button>
    </div>
  </div>

  <script>
    // 1. Daftarkan Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker terdaftar:', reg.scope))
          .catch(err => console.error('Service Worker gagal:', err));
      });
    }

    // 2. Tangkap Event Install PWA
    let deferredPrompt;
    const installBanner = document.getElementById('installBanner');
    const btnInstall = document.getElementById('btnInstall');
    const btnClose = document.getElementById('btnClose');

    window.addEventListener('beforeinstallprompt', (e) => {
      // Mencegah mini-infobar bawaan browser muncul terlambat
      e.preventDefault();
      deferredPrompt = e;
      
      // Langsung tampilkan banner install di halaman depan
      installBanner.style.display = 'flex';
    });

    // Trigger instalasi saat tombol diklik
    btnInstall.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      
      // Memunculkan dialog install resmi dari browser
      deferredPrompt.prompt();
      
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        console.log('User menerima instalasi PWA');
      }
      deferredPrompt = null;
      installBanner.style.display = 'none';
    });

    btnClose.addEventListener('click', () => {
      installBanner.style.display = 'none';
    });

    // Sembunyikan banner jika sudah terinstall
    window.addEventListener('appinstalled', () => {
      installBanner.style.display = 'none';
      deferredPrompt = null;
    });
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b91c1c">
  <meta name="description" content="Order Asap Pedas X Teko">

  <title>Order Asap Pedas X Teko</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    #installBanner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 420px;
      padding: 18px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,.25);
      z-index: 999999;
      border: 1px solid #eee;
    }

    .banner-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .banner-icon {
      width: 55px;
      height: 55px;
      border-radius: 14px;
      background: #b91c1c;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      flex-shrink: 0;
    }

    .banner-title {
      font-size: 17px;
      font-weight: bold;
      color: #222;
    }

    .banner-desc {
      font-size: 13px;
      color: #666;
      margin-top: 5px;
    }

    .banner-buttons {
      display: flex;
      gap: 10px;
      margin-top: 17px;
    }

    .btn-install {
      flex: 1;
      border: none;
      padding: 13px;
      background: #b91c1c;
      color: white;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-later {
      border: none;
      padding: 13px 18px;
      background: #eeeeee;
      color: #333;
      border-radius: 10px;
      cursor: pointer;
    }

    #manualInstall {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: #fff7ed;
      border-radius: 10px;
      font-size: 13px;
      color: #7c2d12;
      line-height: 1.6;
    }

    #openWebsite {
      display: none;
      margin: 30px auto;
      padding: 15px 25px;
      background: #b91c1c;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- Banner Install PWA -->
  <div id="installBanner">

    <div class="banner-header">
      <div class="banner-icon">🍗</div>

      <div>
        <div class="banner-title">
          Order Asap Pedas X Teko
        </div>

        <div class="banner-desc">
          Install aplikasi untuk akses lebih cepat!
        </div>
      </div>
    </div>

    <div class="banner-buttons">
      <button class="btn-install" id="installBtn">
        INSTALL SEKARANG
      </button>

      <button class="btn-later" id="laterBtn">
        NANTI
      </button>
    </div>

    <div id="manualInstall">
      <b>Cara Install:</b><br>
      1. Klik menu browser (⋮ atau Share).<br>
      2. Pilih <b>Tambahkan ke Layar Utama</b> / 
      <b>Add to Home Screen</b>.<br>
      3. Klik Tambahkan / Install.
    </div>

  </div>

  <button id="openWebsite">
    BUKA WEBSITE ORDER
  </button>

  <script>
    // URL WEBSITE ORDER
    const TARGET_URL =
      "https://script.google.com/macros/s/AKfycbwvndVST2ihd0uiG8x-pLIh-PRhn2G_YvGmuO2tcOLKaxUtlyNgcGKHJdIFPvf5G_7hNw/exec";

    const banner = document.getElementById("installBanner");
    const installBtn = document.getElementById("installBtn");
    const laterBtn = document.getElementById("laterBtn");
    const manualInstall = document.getElementById("manualInstall");
    const openWebsite = document.getElementById("openWebsite");

    let deferredPrompt = null;

    // Cek apakah sudah terinstall
    const isInstalled =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;

    // Redirect ke website order
    function openOrderWebsite() {
      window.location.replace(TARGET_URL);
    }

    // Registrasi Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js")
          .catch(function(error) {
            console.log("Service Worker Error:", error);
          });
      });
    }

    // Jika aplikasi sudah terinstall
    if (isInstalled) {
      openOrderWebsite();
    } else {
      // Tampilkan banner
      banner.style.display = "block";

      // Jika browser tidak mendukung install prompt
      openWebsite.style.display = "block";
      openWebsite.onclick = openOrderWebsite;
    }

    // Browser mendeteksi PWA bisa diinstall
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      deferredPrompt = e;

      installBtn.style.display = "block";
      manualInstall.style.display = "none";
    });

    // Tombol INSTALL
    installBtn.addEventListener("click", async function() {

      if (deferredPrompt) {
        deferredPrompt.prompt();

        const result = await deferredPrompt.userChoice;

        if (result.outcome === "accepted") {
          banner.style.display = "none";
        }

        deferredPrompt = null;

      } else {
        // iPhone / Safari / browser yang tidak menyediakan prompt
        manualInstall.style.display = "block";
      }
    });

    // Tombol NANTI
    laterBtn.addEventListener("click", function() {
      banner.style.display = "none";
      openWebsite.style.display = "block";
    });

    // Setelah berhasil diinstall
    window.addEventListener("appinstalled", function() {
      banner.style.display = "none";
      openOrderWebsite();
    });

  </script>

</body>
</html>

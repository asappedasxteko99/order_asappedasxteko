<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Web</title>
  
  <!-- Link ke Manifest PWA -->
  <meta name="theme-color" content="#0f172a">
  
  <!-- Dukungan untuk iOS (Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2991/2991148.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    /* Iframe Fullscreen untuk Google Apps Script */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Banner / Tombol Install Mengambang di Halaman Depan */
    #installBanner {
      display: none; /* Muncul otomatis jika browser mendukung install */
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #ffffff;
      padding: 14px 20px;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      z-index: 9999;
      align-items: center;
      gap: 14px;
      animation: slideUp 0.4s ease-out;
    }
    @keyframes slideUp {
      from { bottom: -80px; opacity: 0; }
      to { bottom: 24px; opacity: 1; }
    }
    #installBanner span {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
    }
    #btnInstall {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #btnInstall:hover {
      background: #1d4ed8;
    }
    #btnClose {
      background: transparent;
      color: #94a3b8;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
    }
  </style>
</head>
<body>

  <!-- Memuat Google Apps Script Anda -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbwvndVST2ihd0uiG8x-pLIh-PRhn2G_YvGmuO2tcOLKaxUtlyNgcGKHJdIFPvf5G_7hNw/exec" 
    allow="geolocation; microphone; camera; fullscreen">
  </iframe>

  <!-- Pop-up Tombol Install PWA -->
  <div id="installBanner">
    <span>Pasang Aplikasi ini</span>
    <button id="btnInstall">Install</button>
    <button id="btnClose" title="Tutup">&times;</button>
  </div>

  <script>
    // 1. Registrasi Service Worker (Syarat wajib PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker terdaftar:', reg.scope))
          .catch(err => console.error('Service Worker gagal:', err));
      });
    }

    // 2. Tangkap Event Install PWA dari Browser
    let deferredPrompt;
    const installBanner = document.getElementById('installBanner');
    const btnInstall = document.getElementById('btnInstall');
    const btnClose = document.getElementById('btnClose');

    window.addEventListener('beforeinstallprompt', (e) => {
      // Mencegah prompt mini default browser agar kita bisa memakai tombol custom
      e.preventDefault();
      deferredPrompt = e;
      // Tampilkan tombol Install di halaman depan
      installBanner.style.display = 'flex';
    });

    // 3. Aksi saat tombol Install diklik
    btnInstall.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      
      // Munculkan dialog instalasi native perangkat (Android/Desktop)
      deferredPrompt.prompt();
      
      const { outcome } = await deferredPrompt.userChoice;
      console.log(`Pilihan user: ${outcome}`);
      
      deferredPrompt = null;
      installBanner.style.display = 'none';
    });

    // Sembunyikan banner jika aplikasi sudah selesai di-install
    window.addEventListener('appinstalled', () => {
      installBanner.style.display = 'none';
      deferredPrompt = null;
    });

    // Tombol tutup manual
    btnClose.addEventListener('click', () => {
      installBanner.style.display = 'none';
    });
  </script>

<script>
    // 1. MANIFEST INLINE (via Blob)
    const manifestData = {
      "name": "App Asap Pedas X Teko",
      "short_name": "Asap Pedas X Teko",
      "description": "Mmudahkan Pesan Makanan ",
      "start_url": window.location.href,
      "display": "standalone",
      "background_color": "#ffffff",
      "theme_color": "#0d6efd",
      "icons": [
        {
          "src": "https://via.placeholder.com/192/0d6efd/ffffff?text=192",
          "type": "image/png",
          "sizes": "192x192"
        },
        {
          "src": "https://via.placeholder.com/512/0d6efd/ffffff?text=512",
          "type": "image/png",
          "sizes": "512x512"
        }
      ]
    };

    const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
    const manifestURL = URL.createObjectURL(manifestBlob);
    document.querySelector('#my-manifest').setAttribute('href', manifestURL);

    // 2. SERVICE WORKER INLINE (via Blob)
    const swCode = `
      const CACHE_NAME = 'satu-file-v1';

      self.addEventListener('install', (event) => {
        self.skipWaiting();
        event.waitUntil(
          caches.open(CACHE_NAME).then((cache) => {
            return cache.addAll([self.registration.scope]);
          })
        );
      });

      self.addEventListener('activate', (event) => {
        event.waitUntil(self.clients.claim());
      });

      self.addEventListener('fetch', (event) => {
        if (event.request.method !== 'GET') return;
        event.respondWith(
          caches.match(event.request).then((cached) => {
            return cached || fetch(event.request).then((response) => {
              const copy = response.clone();
              caches.open(CACHE_NAME).then((cache) => cache.put(event.request, copy));
              return response;
            }).catch(() => cached);
          })
        );
      });
    `;

    const statusEl = document.getElementById('status');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swURL = URL.createObjectURL(swBlob);

        navigator.serviceWorker.register(swURL)
          .then((reg) => {
            statusEl.textContent = 'Service Worker aktif (via Blob): ' + reg.scope;
          })
          .catch((err) => {
            statusEl.textContent = 'Gagal mendaftarkan SW: ' + err.message;
          });
      });
    } else {
      statusEl.textContent = 'Browser tidak mendukung Service Worker.';
    }
  </script>

  
</body>
</html>
